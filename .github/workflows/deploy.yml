name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Add these as repo Secrets (Settings > Secrets and variables > Actions)
          # so real numbers aren't committed to the repo.
          VITE_WA_NUMBER: ${{ secrets.VITE_WA_NUMBER }}
          VITE_DANA_NUMBER: ${{ secrets.VITE_DANA_NUMBER }}
          VITE_DANA_NAME: ${{ secrets.VITE_DANA_NAME }}
          VITE_BUSINESS_NAME: ${{ secrets.VITE_BUSINESS_NAME }}
          VITE_BUSINESS_ADDRESS: ${{ secrets.VITE_BUSINESS_ADDRESS }}
          VITE_BUSINESS_HOURS: ${{ secrets.VITE_BUSINESS_HOURS }}
          VITE_BUSINESS_INSTAGRAM: ${{ secrets.VITE_BUSINESS_INSTAGRAM }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
